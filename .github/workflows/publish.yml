name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'
  # テストゲートのみを手動検証するための trigger (publish は tag push 時のみ)
  workflow_dispatch:

jobs:
  # Release gate (#11548): いずれかの suite が fail したら publish しない
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (VS Code test host)
        run: xvfb-run -a npm test

      - name: E2E tests (VS Code test host)
        run: xvfb-run -a npm run test:e2e

      - name: Webview tests (jest)
        run: npm run test:webview

  publish:
    needs: test
    # tag push のみ。workflow_dispatch は ref に tag を指定しても publish しない
    # (event 種別を見ないと手動 dispatch on tag ref が publish 条件を満たす — #11548 review #55769)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
